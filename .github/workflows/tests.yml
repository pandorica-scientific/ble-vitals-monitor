name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native tests (C++ and Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the native test suites
        run: sh tests/run.sh

  firmware:
    name: Firmware compiles (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core and LovyanGFX
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "LovyanGFX@1.2.26"
      - name: Compile every sketch
        run: |
          arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=no_fs --warnings more firmware/cyd_vitals
          arduino-cli compile -b esp32:esp32:esp32 --warnings more firmware/reader_serial
          arduino-cli compile -b esp32:esp32:esp32 --warnings more firmware/bandsniff
          arduino-cli compile -b esp32:esp32:esp32 --warnings more firmware/provision_wifi
